<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMD Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <style>
        :root { --amd-red: #ED1C24; }
        .bg-amd { background-color: var(--amd-red); }
        .border-amd { border-color: var(--amd-red); }
        .gantt .bar-progress { fill: var(--amd-red) !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-black text-white p-6 shadow-lg border-b-4 border-amd">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold tracking-tighter">AMD <span class="text-gray-400 font-light text-2xl">DASHBOARD</span></h1>
            
            <div class="flex items-center gap-4">
                <select id="teamFilter" onchange="loadData()" class="bg-gray-800 text-white p-2 rounded-lg border border-gray-700 text-sm outline-none focus:ring-2 focus:ring-red-500">
                    <option value="all">ALL TEAMS</option>
                    </select>
                <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-amd hover:bg-red-700 text-white px-6 py-2 rounded-full font-bold transition whitespace-nowrap">
                    + NEW PROJECT
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10"></div>
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-800 uppercase tracking-tight">Timeline</h2>
            <div id="gantt"></div>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 border-b pb-2">New Entry</h2>
            <form id="projectForm" class="space-y-4">
                <input type="text" id="name" placeholder="Project Name" class="w-full p-3 border rounded-lg" required>
                <select id="team_id" class="w-full p-3 border rounded-lg"></select>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-gray-400">START</label><input type="date" id="start_date" class="w-full p-2 border rounded-lg" required></div>
                    <div><label class="text-xs font-bold text-gray-400">END</label><input type="date" id="end_date" class="w-full p-2 border rounded-lg" required></div>
                </div>
                <select id="status" class="w-full p-3 border rounded-lg">
                    <option>On Track</option>
                    <option>Delayed</option>
                    <option>Completed</option>
                </select>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 py-3 text-gray-400 font-bold">Cancel</button>
                    <button type="submit" class="flex-1 bg-amd text-white py-3 rounded-lg font-bold shadow-lg">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadData() {
            const filterValue = document.getElementById('teamFilter').value;
            const res = await fetch(`/projects?team_id=${filterValue}`);
            const projects = await res.json();
            
            const projectList = document.getElementById('project-list');
            projectList.innerHTML = projects.map(p => `
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-8 ${p.status === 'Delayed' ? 'border-orange-500' : 'border-amd'} relative group">
                    <button onclick="deleteProject(${p.id})" class="absolute top-2 right-2 text-gray-300 hover:text-red-500 font-bold text-xs transition opacity-0 group-hover:opacity-100">DELETE</button>
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">${p.team_name}</p>
                    <h3 class="text-lg font-black text-gray-900 mb-1">${p.name}</h3>
                    <div class="flex justify-between items-center mt-3">
                        <span class="px-2 py-1 bg-gray-100 text-[10px] font-bold rounded uppercase">${p.status}</span>
                        <span class="text-gray-400 text-[10px] uppercase">${new Date(p.start_date).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('gantt').innerHTML = "";
            if (projects.length > 0) {
                const tasks = projects.map(p => ({
                    id: p.id.toString(),
                    name: p.name,
                    start: p.start_date.split('T')[0],
                    end: p.end_date.split('T')[0],
                    progress: 50
                }));
                new Gantt("#gantt", tasks, { view_mode: 'Day', bar_height: 25 });
            }
        }

        async function deleteProject(id) {
            if (confirm("Delete this project?")) {
                await fetch(`/projects/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                team_id: document.getElementById('team_id').value,
                status: document.getElementById('status').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                progress: 0
            };
            await fetch('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            document.getElementById('modal').classList.add('hidden');
            loadData();
        });

        async function loadTeams() {
            const res = await fetch('/teams');
            const teams = await res.json();
            const options = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            document.getElementById('team_id').innerHTML = options;
            document.getElementById('teamFilter').innerHTML += options; // Add to filter too
        }

        loadTeams();
        loadData();
    </script>
</body>
</html>
