<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMD Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --amd-red: #ED1C24; }
        .bg-amd { background-color: var(--amd-red); }
        #main-app { display: none; }
        @keyframes pulse-red { 0%, 100% { background-color: #fff; } 50% { background-color: #fee2e2; } }
        .delayed-alert { animation: pulse-red 2s infinite; border-left: 5px solid var(--amd-red) !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

<div id="login-page" class="fixed inset-0 bg-black flex items-center justify-center z-[100]">
    <div class="bg-white p-10 rounded-2xl shadow-2xl max-w-sm w-full text-center">
        <h1 id="auth-title" class="text-2xl font-black italic uppercase mb-6 tracking-tighter">AMD Access</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" class="w-full p-3 border rounded-lg bg-gray-50 text-sm">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg bg-gray-50 text-sm">
            
            <div class="bg-gray-100 p-3 rounded-lg flex items-center justify-between border border-gray-200">
                <span class="text-xs font-bold text-gray-600">Security: What is <span id="captcha-question" class="text-black text-sm"></span>?</span>
                <input type="number" id="captcha-answer" class="w-16 p-1 text-center border rounded text-sm font-bold">
            </div>

            <button id="auth-btn" onclick="handleAuth()" class="w-full bg-amd text-white py-3 rounded-lg font-bold uppercase shadow-lg hover:bg-red-700 transition">Unlock Dashboard</button>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-100">
            <p id="auth-toggle-text" class="text-xs text-gray-400">Don't have an account?</p>
            <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-amd font-bold text-xs uppercase hover:underline">Create Account</button>
        </div>
        <p id="login-error" class="text-red-500 text-[10px] mt-4 font-bold uppercase hidden"></p>
    </div>
</div>

<div id="main-app">
    <header class="bg-black text-white p-4 shadow-xl border-b-4 border-amd sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Asset Management Department</h1>
            <div class="flex flex-wrap gap-2 items-center">
                <select id="timeFilter" onchange="renderTable()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-[10px] font-bold text-yellow-400">
                    <option value="all">ALL DATES</option>
                    <option value="overdue">⚠️ OVERDUE</option>
                    <option value="week">DUE NEXT 7 DAYS</option>
                    <option value="month">DUE THIS MONTH</option>
                </select>

                <select id="statusFilter" onchange="loadData()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-[10px] font-bold">
                    <option value="all">ALL STATUS</option>
                    <option value="On Track">ON TRACK</option>
                    <option value="Delayed">DELAYED</option>
                    <option value="Completed">COMPLETED</option>
                </select>
                <select id="teamFilter" onchange="loadData()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-[10px] font-bold">
                    <option value="all">ALL TEAMS</option>
                </select>
                <select id="sortOrder" onchange="renderTable()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-[10px] font-bold">
                    <option value="asc">SORT A-Z</option>
                    <option value="desc">SORT Z-A</option>
                </select>
                
                <button onclick="showHistory()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-full font-bold text-[10px] transition">📜 LOGS</button>
                <button onclick="exportToPDF()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded-full font-bold text-[10px]">📊 PDF</button>
                <button onclick="openModal()" class="bg-amd hover:bg-red-700 text-white px-3 py-1 rounded-full font-bold text-[10px]">+ NEW</button>
                <button onclick="location.reload()" class="text-gray-500 hover:text-white text-[10px] font-bold uppercase ml-2">Logout</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="max-h-[400px] overflow-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 text-gray-400 text-[10px] font-bold uppercase sticky top-0 z-10">
                        <tr>
                            <th class="p-4">Project</th>
                            <th class="p-4">Team</th>
                            <th class="p-4">Addl. Teams</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 w-32">Progress</th>
                            <th class="p-4">Remarks</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="project-list-rows" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="flex justify-between items-center p-3 bg-gray-50 border-t border-gray-200">
                <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1 bg-gray-200 text-gray-700 rounded text-[10px] font-bold uppercase disabled:opacity-30">Prev</button>
                <span id="pageInfo" class="text-[10px] text-gray-400 font-bold uppercase">Page 1</span>
                <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1 bg-black text-white rounded text-[10px] font-bold uppercase disabled:opacity-30">Next</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 lg:col-span-1">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-4 text-center">Portfolio Health</h2>
                <div class="h-48 flex items-center justify-center"><canvas id="statusChart"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 lg:col-span-2">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-4 text-center">Team Workload Distribution</h2>
                <div class="h-56"><canvas id="heatmapChart"></canvas></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
            <h2 class="text-xs font-bold text-gray-400 uppercase mb-4">Timeline Performance</h2>
            <div id="gantt"></div>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-xl font-bold mb-6 italic uppercase tracking-tighter">Project Entry</h2>
            <form id="projectForm" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="text" id="name" placeholder="Project Name" class="w-full p-2 border rounded bg-gray-50 text-sm font-bold" required>
                
                <div class="space-y-1 border-t pt-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Primary Team</label>
                    <select id="team_id" class="w-full p-2 border rounded bg-gray-50 text-sm"></select>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Additional / Supporting Teams</label>
                    <div id="additionalTeamsContainer" class="bg-gray-50 p-2 border rounded grid grid-cols-2 gap-2 max-h-24 overflow-y-auto"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 border-t pt-2">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Start Date</label>
                        <input type="date" id="start_date" class="w-full p-2 border rounded bg-gray-50 text-sm" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">End Date</label>
                        <input type="date" id="end_date" class="w-full p-2 border rounded bg-gray-50 text-sm" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Progress %</label>
                        <input type="number" id="progress" placeholder="0-100" min="0" max="100" class="w-full p-2 border rounded bg-gray-50 text-sm" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Status</label>
                        <select id="status" class="w-full p-2 border rounded bg-gray-50 text-sm">
                            <option>On Track</option><option>Delayed</option><option>Completed</option>
                        </select>
                    </div>
                </div>

                <textarea id="projectRemarks" placeholder="Remarks" rows="2" class="w-full p-2 border rounded bg-gray-50 text-sm"></textarea>
                
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 text-gray-400 font-bold text-xs uppercase">Cancel</button>
                    <button type="submit" class="flex-1 bg-amd text-white py-3 rounded-lg font-bold text-xs uppercase shadow-lg">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="dates-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h2 id="dates-modal-title" class="text-lg font-bold mb-4 text-gray-800"></h2>
            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border mb-4">
                <div><p class="text-[10px] font-bold text-gray-400">START</p><p id="dates-modal-start" class="font-bold text-sm"></p></div>
                <div>➡️</div>
                <div><p class="text-[10px] font-bold text-gray-400">END</p><p id="dates-modal-end" class="font-bold text-sm"></p></div>
            </div>
            <button onclick="document.getElementById('dates-modal').classList.add('hidden')" class="w-full bg-black text-white py-2 rounded-lg font-bold text-xs uppercase">Close</button>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[80vh] flex flex-col text-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black italic uppercase">Audit Logs</h2>
                <button onclick="closeHistory()" class="text-gray-400 hover:text-black">✕</button>
            </div>
            <div class="overflow-y-auto flex-grow border rounded"><table class="w-full text-left text-xs"><tbody id="history-rows"></tbody></table></div>
            <div class="mt-4 flex justify-between"><button id="admin-clear-btn" onclick="clearHistory()" class="hidden text-red-500 font-bold text-xs uppercase">Clear History</button><button onclick="closeHistory()" class="bg-gray-100 px-4 py-2 rounded font-bold text-xs ml-auto">Close</button></div>
        </div>
    </div>
</div>

<script>
    let statusChartInstance, heatmapChartInstance, allProjects = [], allTeamsList = [], currentPage = 1, currentUser = null, isLoginMode = true;
    let captchaNum1, captchaNum2;

    function generateCaptcha() {
        captchaNum1 = Math.floor(Math.random() * 10) + 1;
        captchaNum2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('captcha-question').innerText = `${captchaNum1} + ${captchaNum2}`;
        document.getElementById('captcha-answer').value = '';
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "AMD Access" : "Join AMD Portal";
        document.getElementById('auth-btn').innerText = isLoginMode ? "Unlock Dashboard" : "Create Account";
        document.getElementById('auth-toggle-btn').innerText = isLoginMode ? "Create Account" : "Back to Login";
        generateCaptcha();
    }

    async function handleAuth() {
        const userAnswer = parseInt(document.getElementById('captcha-answer').value);
        if (userAnswer !== (captchaNum1 + captchaNum2)) { alert("Captcha Failed"); generateCaptcha(); return; }
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch(isLoginMode ? '/login' : '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (res.ok) {
            if (!isLoginMode) { alert("Account Ready!"); toggleAuthMode(); }
            else { currentUser = data.username; document.getElementById('login-page').style.display='none'; document.getElementById('main-app').style.display='block'; if(currentUser === 'admin') document.getElementById('admin-clear-btn').classList.remove('hidden'); init(); }
        } else { alert(data.message); generateCaptcha(); }
    }

    generateCaptcha();

    async function loadData() {
        const team = document.getElementById('teamFilter').value;
        const status = document.getElementById('statusFilter').value;
        const res = await fetch(`/projects?team_id=${team}&status=${status}`);
        allProjects = await res.json();
        renderTable(); updateChart(); renderHeatmap(); renderGantt();
    }

    function renderTable() {
        const sortOrder = document.getElementById('sortOrder').value;
        const timeFilter = document.getElementById('timeFilter').value;
        const today = new Date(); today.setHours(0,0,0,0);

        let filtered = allProjects.filter(p => {
            const endDate = new Date(p.end_date);
            if (timeFilter === 'overdue') return endDate < today && p.status !== 'Completed';
            if (timeFilter === 'month') return endDate.getMonth() === today.getMonth() && endDate.getFullYear() === today.getFullYear();
            if (timeFilter === 'week') {
                const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 7);
                return endDate >= today && endDate <= nextWeek;
            }
            return true;
        });

        filtered.sort((a, b) => sortOrder === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
        const start = (currentPage - 1) * 10;
        const paginated = filtered.slice(start, start + 10);
        
        document.getElementById('project-list-rows').innerHTML = paginated.map(p => {
            const overdue = new Date(p.end_date) < today && p.status !== 'Completed';
            const barColor = p.status === 'Completed' ? 'bg-green-500' : (p.status === 'Delayed' ? 'bg-red-500' : 'bg-blue-500');
            return `<tr class="${overdue ? 'delayed-alert' : ''} border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-4 font-bold text-gray-800">${p.name}</td>
                <td class="p-4 text-[10px] font-bold text-gray-500">${p.team_name}</td>
                <td class="p-4 text-[10px] font-bold text-gray-500">${p.secondary_team || '-'}</td>
                <td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase ${p.status === 'On Track' ? 'bg-blue-50 text-blue-600' : p.status === 'Delayed' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">${p.status}</span></td>
                <td class="p-4"><div class="flex items-center gap-2"><div class="flex-grow bg-gray-200 rounded-full h-1.5 overflow-hidden"><div class="${barColor} h-full" style="width: ${p.progress}%"></div></div><span class="text-[10px] font-bold text-gray-400">${p.progress}%</span></div></td>
                <td class="p-4 text-[10px] text-gray-500 truncate max-w-[100px]">${p.remarks || '-'}</td>
                <td class="p-4 text-center space-x-2">
                    <button onclick="showDates('${p.name}', '${p.start_date}', '${p.end_date}')" class="bg-gray-100 px-2 py-1 rounded font-bold text-[9px]">📅 DATES</button>
                    <button onclick="editProject(${p.id})" class="text-blue-500 font-bold text-[10px]">EDIT</button>
                    <button onclick="deleteProject(${p.id})" class="text-red-500 font-bold text-[10px]">DEL</button>
                </td>
            </tr>`;
        }).join('');
        document.getElementById('pageInfo').innerText = `Page ${currentPage}`;
        document.getElementById('nextBtn').disabled = start + 10 >= filtered.length;
        document.getElementById('prevBtn').disabled = currentPage === 1;
    }

    function updateChart() {
        const counts = { 'On Track': 0, 'Delayed': 0, 'Completed': 0 };
        allProjects.forEach(p => counts[p.status]++);
        const ctx = document.getElementById('statusChart').getContext('2d');
        if (statusChartInstance) statusChartInstance.destroy();
        Chart.register(ChartDataLabels);
        statusChartInstance = new Chart(ctx, {
            type: 'pie', data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#3B82F6', '#ED1C24', '#10B981'], borderWidth: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 10 } } }, datalabels: { color: '#fff', font: { weight: 'bold', size: 10 }, formatter: (v) => v > 0 ? v : null } } }
        });
    }

    function renderHeatmap() {
        const teamData = {};
        allTeamsList.forEach(t => teamData[t.name] = { 'On Track': 0, 'Delayed': 0, 'Completed': 0 });
        allProjects.forEach(p => { if(teamData[p.team_name]) teamData[p.team_name][p.status]++; });

        const labels = Object.keys(teamData);
        const onTrack = labels.map(l => teamData[l]['On Track']);
        const delayed = labels.map(l => teamData[l]['Delayed']);
        const completed = labels.map(l => teamData[l]['Completed']);

        const ctx = document.getElementById('heatmapChart').getContext('2d');
        if (heatmapChartInstance) heatmapChartInstance.destroy();
        
        heatmapChartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [
                { label: 'Completed', data: completed, backgroundColor: '#10B981' },
                { label: 'On Track', data: onTrack, backgroundColor: '#3B82F6' },
                { label: 'Delayed', data: delayed, backgroundColor: '#ED1C24' }
            ]},
            options: { 
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                layout: { padding: { right: 40 } },
                scales: { 
                    x: { stacked: true, display: false }, 
                    y: { stacked: true, ticks: { font: { size: 13, weight: 'bold' }, color: '#374151' } } 
                },
                plugins: { 
                    legend: { display: true, position: 'top', labels: { boxWidth: 10, font:{size:10} } },
                    datalabels: {
                        display: (ctx) => ctx.datasetIndex === 2, // Only show total on the final segment
                        anchor: 'end', align: 'right', color: '#000', font: { weight: 'bold', size: 12 },
                        formatter: (val, ctx) => {
                            const i = ctx.dataIndex;
                            const total = onTrack[i] + delayed[i] + completed[i];
                            return total > 0 ? total : '';
                        }
                    } 
                } 
            }
        });
    }

    function showDates(name, start, end) {
        document.getElementById('dates-modal-title').innerText = name;
        document.getElementById('dates-modal-start').innerText = start.split('T')[0];
        document.getElementById('dates-modal-end').innerText = end.split('T')[0];
        document.getElementById('dates-modal').classList.remove('hidden');
    }

    function editProject(id) {
        const p = allProjects.find(x => x.id === id);
        if (!p) return;
        document.getElementById('modalTitle').innerText = "Edit Entry";
        document.getElementById('edit-id').value = p.id;
        document.getElementById('name').value = p.name;
        document.getElementById('progress').value = p.progress;
        document.getElementById('status').value = p.status;
        document.getElementById('start_date').value = p.start_date.split('T')[0];
        document.getElementById('end_date').value = p.end_date.split('T')[0];
        const sec = p.secondary_team ? p.secondary_team.split(', ') : [];
        document.querySelectorAll('.add-team-cb').forEach(cb => cb.checked = sec.includes(cb.value));
        document.getElementById('projectRemarks').value = p.remarks || '';
        document.getElementById('modal').classList.remove('hidden');
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const selected = Array.from(document.querySelectorAll('.add-team-cb:checked')).map(cb => cb.value).join(', ');
        const data = { name: document.getElementById('name').value, team_id: document.getElementById('team_id').value, start_date: document.getElementById('start_date').value, end_date: document.getElementById('end_date').value, progress: document.getElementById('progress').value, status: document.getElementById('status').value, secondary_team: selected, remarks: document.getElementById('projectRemarks').value, user: currentUser };
        if (id) await fetch(`/projects/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        else await fetch('/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        closeModal(); loadData();
    });

    async function showHistory() {
        const res = await fetch('/logs'); const logs = await res.json();
        document.getElementById('history-rows').innerHTML = logs.map(l => `<tr class="border-b"><td class="p-2 font-bold">${l.project_name || 'Del'}</td><td class="p-2 text-gray-500">${l.action}</td><td class="p-2 font-bold text-blue-500">${l.changed_by}</td></tr>`).join('');
        document.getElementById('history-modal').classList.remove('hidden');
    }

    async function clearHistory() { if(confirm("Clear All?")) { await fetch('/logs', { method: 'DELETE' }); showHistory(); } }
    function closeHistory() { document.getElementById('history-modal').classList.add('hidden'); }
    async function deleteProject(id) { if (confirm("Delete?")) { await fetch(`/projects/${id}`, { method: 'DELETE' }); loadData(); } }

    function renderGantt() {
        const container = document.getElementById('gantt'); container.innerHTML = "";
        if (allProjects.length > 0) {
            const tasks = allProjects.map(p => ({ id: p.id.toString(), name: p.name, start: p.start_date.split('T')[0], end: p.end_date.split('T')[0], progress: p.progress }));
            new Gantt("#gantt", tasks, { view_mode: 'Week', bar_height: 20 });
        }
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        doc.setFontSize(18); doc.text("AMD STATUS REPORT", 14, 20);
        doc.autoTable({ startY: 30, head: [['Project', 'Team', 'Status', 'Progress']], body: allProjects.map(p => [p.name, p.team_name, p.status, p.progress + "%"]), headStyles: { fillColor: [237, 28, 36] } });
        doc.save("AMD_Report.pdf");
    }

    async function init() {
        const res = await fetch('/teams'); allTeamsList = await res.json();
        const primary = allTeamsList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        document.getElementById('team_id').innerHTML = primary;
        document.getElementById('teamFilter').innerHTML += primary;
        document.getElementById('additionalTeamsContainer').innerHTML = allTeamsList.map(t => `<label class="flex items-center space-x-2 text-[10px] font-bold p-1 hover:bg-gray-100 rounded"><input type="checkbox" value="${t.name}" class="add-team-cb"><span>${t.name}</span></label>`).join('');
        loadData();
    }

    function openModal() { document.getElementById('projectForm').reset(); document.getElementById('edit-id').value = ""; document.querySelectorAll('.add-team-cb').forEach(cb => cb.checked = false); document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    function changePage(dir) { currentPage += dir; renderTable(); }
</script>
</body>
</html>
