<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMD Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --amd-red: #ED1C24; }
        body { font-family: 'Montserrat', sans-serif !important; }
        .bg-amd { background-color: var(--amd-red); }
        #main-app { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-black">

<div id="login-page" class="fixed inset-0 bg-blue-900 flex items-center justify-center z-[100]">
    <div class="bg-white p-10 rounded-2xl shadow-2xl max-w-sm w-full text-center">
        <h1 class="text-2xl font-black italic uppercase mb-6 tracking-tighter">AMD Access</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" class="w-full p-3 border rounded-lg bg-gray-50 text-sm">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg bg-gray-50 text-sm">
            <button onclick="handleAuth()" class="w-full bg-amd text-white py-3 rounded-lg font-bold uppercase shadow-lg hover:bg-red-700 transition">Unlock Dashboard</button>
        </div>
    </div>
</div>

<div id="main-app">
    <header class="bg-black text-white p-4 shadow-xl border-b-4 border-amd sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic uppercase">Asset Management Department</h1>
            <div class="flex items-center gap-4">
                <select id="teamFilter" onchange="loadData()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-[10px] font-bold">
                    <option value="all">ALL TEAMS</option>
                </select>
                <button onclick="location.reload()" class="text-gray-400 hover:text-white text-[10px] font-bold uppercase">Logout</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-600">
                <p class="text-[10px] font-bold text-gray-500 uppercase">Total Projects</p>
                <h3 id="kpi-total" class="text-2xl font-black">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase">On-Time Rate</p>
                <h3 id="kpi-ontime" class="text-2xl font-black">0%</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase">Active Delays</p>
                <h3 id="kpi-delays" class="text-2xl font-black">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-yellow-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase">Avg. Progress</p>
                <h3 id="kpi-progress" class="text-2xl font-black">0%</h3>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow border overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-[10px] font-bold uppercase sticky top-0">
                    <tr>
                        <th class="p-4">Project</th>
                        <th class="p-4">Team</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 w-48">Progress</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="project-list-rows" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-[11px] font-bold uppercase mb-4">Portfolio Health</h2>
                <div class="h-48"><canvas id="statusChart"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow lg:col-span-2">
                <h2 class="text-[11px] font-bold uppercase mb-4 text-center">Team Workload Distribution</h2>
                <div class="h-64"><canvas id="heatmapChart"></canvas></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow overflow-x-auto">
            <h2 class="text-xs font-bold uppercase mb-4">Timeline Performance</h2>
            <div id="gantt"></div>
        </div>
    </main>
</div>

<script>
    let statusChartInstance, heatmapChartInstance, allProjects = [], allTeamsList = [], currentUser = null;

    async function handleAuth() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/login', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ username, password }) 
        });
        const data = await res.json();
        if (res.ok) {
            currentUser = data.username;
            document.getElementById('login-page').style.display='none';
            document.getElementById('main-app').style.display='block';
            init();
        } else { alert("Login Failed"); }
    }

    async function loadData() {
        const team = document.getElementById('teamFilter').value;
        const res = await fetch(`/projects?team_id=${team}`);
        allProjects = await res.json();
        updateKPIs(allProjects);
        renderTable(); 
        updateChart(); 
        renderHeatmap(); 
        renderGantt();
    }

    function updateKPIs(projects) {
        const total = projects.length;
        const onTrack = projects.filter(p => p.status === 'On Track' || p.status === 'Completed').length;
        const avgProg = total > 0 ? Math.round(projects.reduce((s, p) => s + parseInt(p.progress), 0) / total) : 0;
        document.getElementById('kpi-total').innerText = total;
        document.getElementById('kpi-ontime').innerText = `${total > 0 ? Math.round((onTrack/total)*100) : 0}%`;
        document.getElementById('kpi-delays').innerText = projects.filter(p => p.status === 'Delayed').length;
        document.getElementById('kpi-progress').innerText = `${avgProg}%`;
    }

    function renderTable() {
        document.getElementById('project-list-rows').innerHTML = allProjects.map(p => `
            <tr class="border-b hover:bg-gray-50 transition">
                <td class="p-4 font-bold text-black">${p.name}</td>
                <td class="p-4 text-[10px] font-bold uppercase">${p.team_name}</td>
                <td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase ${p.status === 'On Track' ? 'bg-blue-50 text-blue-600' : 'bg-red-50 text-red-600'}">${p.status}</span></td>
                <td class="p-4">
                    <div class="flex items-center gap-2">
                        <div class="flex-grow bg-gray-200 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-blue-600 h-full" style="width: ${p.progress}%"></div>
                        </div>
                        <span class="text-[10px] font-bold">${p.progress}%</span>
                    </div>
                </td>
                <td class="p-4 text-center"><button class="bg-gray-200 px-2 py-1 rounded font-bold text-[9px]">📅 DATES</button></td>
            </tr>
        `).join('');
    }

    async function init() {
        const res = await fetch('/teams'); 
        allTeamsList = await res.json();
        const primary = allTeamsList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        document.getElementById('teamFilter').innerHTML += primary;
        loadData();
    }
    
    // Additional charting functions (updateChart, renderHeatmap, renderGantt) go here...
</script>
</body>
</html>
