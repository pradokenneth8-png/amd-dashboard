<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMD Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <style>
        :root { --amd-red: #ED1C24; }
        .bg-amd { background-color: var(--amd-red); }
        .border-amd { border-color: var(--amd-red); }
        .gantt .bar-progress { fill: var(--amd-red) !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-black text-white p-6 shadow-lg border-b-4 border-amd">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tighter">AMD <span class="text-gray-400 font-light">DASHBOARD</span></h1>
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-amd hover:bg-red-700 text-white px-6 py-2 rounded-full font-bold transition">
                + NEW PROJECT
            </button>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <div id="status-cards" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            </div>

        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Timeline Performance</h2>
            <div id="gantt"></div>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 border-b pb-2">Create New Entry</h2>
            <form id="projectForm" class="space-y-4">
                <input type="text" id="name" placeholder="Project Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" required>
                
                <select id="team_id" class="w-full p-3 border rounded-lg"></select>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500">START DATE</label>
                        <input type="date" id="start_date" class="w-full p-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">END DATE</label>
                        <input type="date" id="end_date" class="w-full p-2 border rounded-lg" required>
                    </div>
                </div>

                <div class="flex justify-between items-center">
                    <label class="font-bold text-gray-700">Status</label>
                    <select id="status" class="p-2 border rounded-lg">
                        <option>On Track</option>
                        <option>Delayed</option>
                        <option>Completed</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 py-3 text-gray-500 font-bold">Cancel</button>
                    <button type="submit" class="flex-1 bg-amd text-white py-3 rounded-lg font-bold shadow-lg">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('/projects');
            const projects = await res.json();
            
            // 1. Update Cards
            const statusBox = document.getElementById('status-cards');
            const counts = { 'On Track': 0, 'Delayed': 0, 'Completed': 0 };
            projects.forEach(p => counts[p.status]++);
            
            statusBox.innerHTML = Object.entries(counts).map(([status, count]) => `
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-8 ${status === 'Delayed' ? 'border-orange-500' : 'border-amd'}">
                    <p class="text-gray-500 text-sm font-bold uppercase tracking-widest">${status}</p>
                    <p class="text-4xl font-black text-gray-900">${count}</p>
                </div>
            `).join('');

            // 2. Update Gantt
            if (projects.length > 0) {
                const ganttTasks = projects.map(p => ({
                    id: p.id.toString(),
                    name: p.name,
                    start: p.start_date,
                    end: p.end_date,
                    progress: p.progress || 50
                }));
                new Gantt("#gantt", ganttTasks, { view_mode: 'Day' });
            }
        }

        // Handle Form Submit
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                team_id: document.getElementById('team_id').value,
                status: document.getElementById('status').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                progress: 0
            };
            await fetch('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            location.reload();
        });

        // Load Teams Dropdown
        async function loadTeams() {
            const res = await fetch('/teams');
            const teams = await res.json();
            document.getElementById('team_id').innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        }

        loadTeams();
        loadData();
    </script>
</body>
</html>
